<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caso 2 - Registro de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- CASO 2: Registro de productos -->
    <main class="container py-4">
        <p class="text-muted">Caso 2: Formulario para Registro de Productos</p>

        <h1 class="display-5 mb-3">Gestión de Productos <span class="badge bg-secondary rounded-pill">Nuevo</span></h1>

        <form>
            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Monitor 24 pulgadas">
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="color" class="form-label">Etiqueta de Color</label>
                    <input type="color" class="form-control form-control-color" id="color" value="#0d6efd">
                </div>
            </div>

            <div class="mb-3">
                <label for="categorias" class="form-label">Categorías Asignadas</label>
                <select class="form-select" id="categorias" multiple>
                    <option>Hardware</option>
                    <option>Periféricos</option>
                    <option>Oficina</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Estado Inicial</label>
                <div class="btn-group">
                    <input type="radio" class="btn-check" name="estado" id="activo" checked>
                    <label class="btn btn-outline-primary" for="activo">Activo</label>

                    <input type="radio" class="btn-check" name="estado" id="inactivo">
                    <label class="btn btn-outline-primary" for="inactivo">Inactivo</label>
                </div>
            </div>

            <button type="button" class="btn btn-success">Guardar Producto</button>
            <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
        </form>
    </main>
</body>
</html>
