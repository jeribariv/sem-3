<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caso 1 - Acceso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- CASO 1: Login -->
    <main class="container py-4">
        <p class="text-muted">Caso 1: Acceso a Control de Usuario (Módulo de Login)</p>
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <div class="alert alert-info alert-dismissible" role="alert">
                    Ingrese sus credenciales para acceder al panel.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <h1 class="display-6">Iniciar Sesión</h1>

                <form>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario">
                    </div>
                    <div class="mb-3">
                        <label for="clave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="clave" placeholder="Ingrese su contraseña">
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-primary">Ingresar al Sistema</button>
                    </div>
                </form>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
