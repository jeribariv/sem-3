<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caso 4 - Panel de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- CASO 4: Dashboard -->
    <main class="container py-4">
        <p class="text-muted">Caso 4: Menú o Panel de Control (Dashboard)</p>

        <div class="alert alert-warning alert-dismissible" role="alert">
            Atención: Mantenimiento de servidor programado para el fin de semana.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h1 class="display-5 mb-3">Panel de Control</h1>

        <!-- Buscador -->
        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="text" class="form-control" placeholder="Buscar módulo o reporte...">
            <button type="button" class="btn btn-primary">Buscar</button>
        </div>

        <div class="row">
            <!-- Accesos directos verticales -->
            <div class="col-12 col-md-3 mb-3">
                <div class="btn-group-vertical w-100">
                    <button type="button" class="btn btn-primary">Resumen General</button>
                    <button type="button" class="btn btn-outline-primary">Ventas</button>
                    <button type="button" class="btn btn-outline-primary">Inventario</button>
                    <button type="button" class="btn btn-outline-primary">Reportes</button>
                </div>
            </div>

            <!-- Métricas con insignias -->
            <div class="col-12 col-md-3 mb-3 text-center">
                <h6>Servicios Activos</h6>
                <span class="badge bg-success rounded-pill">12 Online</span>
            </div>
            <div class="col-12 col-md-3 mb-3 text-center">
                <h6>Alertas Sistema</h6>
                <span class="badge bg-warning rounded-pill">2 Revisar</span>
            </div>
            <div class="col-12 col-md-3 mb-3 text-center">
                <h6>Usuarios Totales</h6>
                <span class="badge bg-primary rounded-pill">1,250</span>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
