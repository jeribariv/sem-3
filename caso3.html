<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caso 3 - CRUD Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- CASO 3: Vistas de mantenimiento CRUD -->
    <main class="container py-4">
        <p class="text-muted">Caso 3: Vistas de Mantenimiento CRUD</p>

        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Inicio</a></li>
                <li class="breadcrumb-item"><a href="#">Administración</a></li>
                <li class="breadcrumb-item active">Usuarios</li>
            </ol>
        </nav>

        <div class="row mb-3">
            <div class="col">
                <h1 class="h2">Mantenimiento de Usuarios</h1>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-primary">
                    Solicitudes Pendientes <span class="badge bg-danger">3</span>
                </button>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4">
            <div class="col mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Carlos Pérez</h5>
                        <p class="card-text">Rol: Administrador</p>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-primary">Ver</button>
                            <button type="button" class="btn btn-outline-warning">Editar</button>
                            <button type="button" class="btn btn-outline-danger">Eliminar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Ana Gómez</h5>
                        <p class="card-text">Rol: Editor</p>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-primary">Ver</button>
                            <button type="button" class="btn btn-outline-warning">Editar</button>
                            <button type="button" class="btn btn-outline-danger">Eliminar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
